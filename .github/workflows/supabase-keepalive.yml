name: Supabase daily keepalive

on:
  schedule:
    # Every day at 09:17 KST (00:17 UTC).
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load public Supabase configuration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const context = { window: {} };
          vm.runInNewContext(fs.readFileSync('js/supabase-config.js', 'utf8'), context, { timeout: 1000 });
          const { url, publishableKey } = context.window.KCULTURE_SUPABASE;
          if (!url || !publishableKey || /[\r\n]/.test(url + publishableKey)) {
            throw new Error('Missing or invalid public Supabase configuration');
          }
          fs.appendFileSync(process.env.GITHUB_ENV,
            `SUPABASE_URL=${url.replace(/\/$/, '')}\nSUPABASE_PUBLISHABLE_KEY=${publishableKey}\n`);
          NODE

      - name: Query Supabase database
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-max-time 120 \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --output /dev/null \
            "${SUPABASE_URL}/rest/v1/posts?select=id&limit=1"
          echo "Supabase database keepalive succeeded."
